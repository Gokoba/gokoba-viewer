name: IFC zu 3D-Viewer

# ★ Eigener, vom STEP-Weg GETRENNTER Zweig: reagiert NUR auf jobs-ifc/,
#   der bestehende Workflow (convert.yml) reagiert NUR auf jobs/.
#   Beide koennen sich dadurch nicht in die Quere kommen.
on:
  push:
    paths:
      - 'jobs-ifc/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gokoba-convert-ifc
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ifcopenshell trimesh numpy
          # ★ gltfpack fest auf 1.1.0, wie im STEP-Workflow (1.2.0 haengt beim Komprimieren).
          npm install -g gltfpack@1.1.0

      - name: Offene IFC-Jobs verarbeiten
        run: |
          # ★ Kein "set -e": ein fehlerhafter Job darf die anderen nicht blockieren.
          shopt -s nullglob
          PROBLEME=0
          for jobdir in jobs-ifc/*/; do
            id=$(basename "$jobdir")
            if [ -f "docs/v/$id/index.html" ]; then continue; fi
            if [ -f "$jobdir/.done" ] || [ -f "$jobdir/.failed" ]; then continue; fi
            echo "::group::IFC-Job $id"
            # ZIP-Uploads entpacken (Windows: rechte Maustaste, ZIP-komprimierter Ordner)
            for z in "$jobdir"*.zip; do
              unzip -o -j "$z" -d "$jobdir" >/dev/null && rm -f "$z"
            done
            # Projektname (optional)
            name="Modell"
            if [ -f "$jobdir/name.txt" ]; then
              name=$(cat "$jobdir/name.txt")
            fi
            mkdir -p "docs/v/$id"
            # ★ 15-Minuten-Zeitlimit je Modell; haengt eines, wird nur dieses abgebrochen.
            if timeout 900 python convert_ifc.py \
                 --input-dir "$jobdir" \
                 --output "docs/v/$id/index.html" \
                 --model-name "$name" \
                 --expiry-days 40 \
                 --gltfpack gltfpack; then
              rm -rf "$jobdir"
              mkdir -p "jobs-ifc/$id"
              date -u +"%Y-%m-%dT%H:%M:%SZ" > "jobs-ifc/$id/.done"
              echo "IFC-Job $id fertig."
            else
              rc=$?
              rm -rf "docs/v/$id"
              rm -rf "$jobdir"
              mkdir -p "jobs-ifc/$id"
              date -u +"%Y-%m-%dT%H:%M:%SZ (Code $rc)" > "jobs-ifc/$id/.failed"
              PROBLEME=$((PROBLEME + 1))
              echo "IFC-Job $id FEHLGESCHLAGEN (Code $rc) - uebersprungen."
            fi
            echo "::endgroup::"
          done
          echo "Durchlauf beendet. Fehlgeschlagene Jobs in diesem Lauf: $PROBLEME"

      - name: Ergebnisse committen
        run: |
          git config user.name "gokoba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "IFC-Viewer erstellt/aktualisiert"
            git push
          fi

      - name: GitHub Pages veroeffentlichen
        if: always()
        run: |
          echo "Stosse GitHub-Pages-Veroeffentlichung an..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          echo "Fertig."
