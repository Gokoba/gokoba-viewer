name: IFC zu 3D-Viewer

# ★ Eigener, vom STEP-Weg GETRENNTER Zweig: reagiert NUR auf jobs-ifc/,
#   der bestehende Workflow (convert.yml) reagiert NUR auf jobs/.
#   Beide koennen sich dadurch nicht in die Quere kommen.
on:
  push:
    paths:
      - 'jobs-ifc/**'
  workflow_dispatch:
  # ★ Besenwagen: verarbeitet liegengebliebene Jobs, falls ein Lauf je scheitert
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: gokoba-convert-ifc
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paket-Cache (pip)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ifc-v2      # ★ v2: cascadio kam dazu, deshalb neuer Schluessel

      - name: Paket-Cache (npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-gltfpack-v1

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # ★ cascadio kam am 21.08. dazu: es liest die STEP-Datei, die das Plugin ab v133
          #   mit ins Paket legt (OpenCascade-Kern, derselbe wie im STEP-Zweig). Ohne dieses
          #   Paket meldet der Konverter 'cascadio fehlt' und ueberspringt die STEP-Datei -
          #   genau das ist am 21.08. passiert, stepweg blieb auf 0.
          pip install ifcopenshell trimesh numpy mapbox_earcut cascadio
          # ★ gltfpack fest auf 1.1.0, wie im STEP-Workflow (1.2.0 haengt beim Komprimieren).
          npm install -g gltfpack@1.1.0

      # ★ NEU: Abgelaufene Modelle entfernen. Jede Veroeffentlichung stellt das GESAMTE
      #   Repository online - je mehr alte Modellordner unter docs/v/ liegen, desto laenger
      #   dauert jeder Upload. Die Links gelten 40 Tage; alles, was aelter als 45 Tage ist,
      #   wird hier geloescht. 45 statt 40, damit ein gerade abgelaufener Link nicht mitten
      #   in einer Kundensitzung verschwindet.
      # ★ NEU (10.08.): Das Aufraeumen hat bisher NIE gegriffen. Es las das Alter ueber
      #   "git log -1 -- <ordner>", actions/checkout holt aber nur EINEN Commit - fuer fast
      #   jeden Ordner kam damit nichts zurueck und die naechste Zeile hat ihn uebersprungen.
      #   Jetzt steht das Datum da, wo es ohnehin schon steht: in der Marke jobs-ifc/<id>/.done,
      #   die dieser Workflow beim Fertigstellen selbst schreibt. Das ist unabhaengig von der
      #   Checkout-Tiefe und kostet nichts.
      #   SICHERUNGEN: geloescht wird NUR, wenn eine .done-Marke existiert UND ein lesbares
      #   Datum enthaelt UND aelter als 45 Tage ist (die Links gelten 40 Tage). Ordner ohne
      #   Marke oder mit unlesbarem Datum bleiben unangetastet. Zusaetzlich hoechstens 40
      #   Loeschungen je Lauf, damit ein Denkfehler nicht auf einen Schlag alles abraeumt.
      - name: Abgelaufene Modelle aufraeumen
        run: |
          set +e
          GRENZE=$(date -u -d '45 days ago' +%s 2>/dev/null || echo 0)
          [ "$GRENZE" = "0" ] && { echo "Datumsrechnung nicht moeglich, uebersprungen."; exit 0; }
          WEG=0
          KAPPE=40
          for d in docs/v/*/; do
            [ "$WEG" -ge "$KAPPE" ] && { echo "Kappe von $KAPPE Loeschungen erreicht - Rest beim naechsten Lauf."; break; }
            id=$(basename "$d")
            M="jobs-ifc/$id/.done"
            [ -f "$M" ] || continue
            S=$(head -c 40 "$M" | tr -d '\r\n')
            T=$(date -u -d "$S" +%s 2>/dev/null)
            case "$T" in ''|*[!0-9]*) continue;; esac
            if [ "$T" -lt "$GRENZE" ]; then
              rm -rf "$d" "jobs-ifc/$id"
              WEG=$((WEG + 1))
              echo "  abgelaufen entfernt: $id (fertig am $S)"
            fi
          done
          echo "Abgelaufene Modelle entfernt: $WEG"
          echo "Noch vorhandene Modelle: $(ls -1d docs/v/*/ 2>/dev/null | wc -l)"

      - name: Offene IFC-Jobs verarbeiten
        run: |
          # ★ Kein "set -e": ein fehlerhafter Job darf die anderen nicht blockieren.
          shopt -s nullglob
          # ★ NEU (10.08.): erst den AKTUELLEN Stand holen. Die Laeufe stehen wegen der
          #   concurrency-Gruppe in einer Reihe; der zweite hat sein Repository aber schon
          #   VOR dem Push des ersten ausgecheckt und sah dessen fertige Modelle nicht -
          #   deshalb wurden einzelne Modelle ZWEIMAL gebaut (nachgewiesen an 89efd93e0f1e
          #   und 40516c92cfad). Ein Abgleich vorweg kostet Sekunden und spart einen ganzen
          #   Durchlauf. Schlaegt er fehl, laeuft alles weiter wie bisher.
          git config user.name "gokoba-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase -X theirs origin main || git rebase --abort >/dev/null 2>&1 || true
          PROBLEME=0
          # ★ Neueste Auftraege zuerst: frische Kunden-Uploads ueberholen Altlasten.
          LISTE=$(for d in jobs-ifc/*/; do t=$(git log -1 --format=%ct -- "$d" 2>/dev/null || echo 0); echo "$t $d"; done | sort -rn | awk '{print $2}')
          for jobdir in $LISTE; do
            id=$(basename "$jobdir")
            # ★ Eine WARTESEITE zaehlt nicht als fertiger Viewer! Das Plugin legt sie
            #   beim Knopfdruck an - ohne diese Pruefung wuerde jeder Job uebersprungen.
            if [ -f "docs/v/$id/index.html" ] && ! grep -q "Modell wird gerade erstellt" "docs/v/$id/index.html"; then continue; fi
            if [ -f "$jobdir/.done" ] || [ -f "$jobdir/.failed" ]; then continue; fi
            echo "::group::IFC-Job $id"
            # Stueckweise hochgeladene ZIPs wieder zusammenfuegen (grosse Modelle).
            # ★ compgen statt ls: "ls pfad*" greift mit nullglob auch OHNE Teile
            #   (Glob verschwindet, ls listet das Repo, Ergebnis 0) und der cat
            #   ueberschreibt dann das gute modell.zip mit einer LEEREN Datei.
            if compgen -G "${jobdir}modell.zip.part*" >/dev/null; then
              cat "$jobdir"modell.zip.part* > "$jobdir/modell.zip.ganz"
              mv "$jobdir/modell.zip.ganz" "$jobdir/modell.zip"
              rm -f "$jobdir"modell.zip.part*
            fi
            # ZIP-Uploads entpacken (Windows: rechte Maustaste, ZIP-komprimierter Ordner)
            for z in "$jobdir"*.zip; do
              unzip -o -j "$z" -d "$jobdir" >/dev/null && rm -f "$z"
            done
            # ★ Noch keine Nutzdaten da (z.B. nur name.txt committet)? Still ueberspringen,
            #   KEIN Fehler-Marker - das ZIP kommt oft erst im naechsten Commit.
            if ! ls "$jobdir"*.zip "$jobdir"*.ifc >/dev/null 2>&1; then
              echo "Job $id: noch keine ZIP/IFC-Datei, warte auf naechsten Commit."
              echo "::endgroup::"
              continue
            fi
            # Projektname (optional)
            name="Modell"
            if [ -f "$jobdir/name.txt" ]; then
              name=$(cat "$jobdir/name.txt")
            fi
            mkdir -p "docs/v/$id"
            # ★ 15-Minuten-Zeitlimit je Modell; haengt eines, wird nur dieses abgebrochen.
            LOGDATEI=$(mktemp)
            if timeout 900 python convert_ifc.py \
                 --input-dir "$jobdir" \
                 --output "docs/v/$id/index.html" \
                 --model-name "$name" \
                 --expiry-days 40 \
                 --gltfpack gltfpack > "$LOGDATEI" 2>&1; then
              cat "$LOGDATEI"
              rm -rf "$jobdir"
              mkdir -p "jobs-ifc/$id"
              date -u +"%Y-%m-%dT%H:%M:%SZ" > "jobs-ifc/$id/.done"
              echo "IFC-Job $id fertig."
            else
              rc=$?
              cat "$LOGDATEI"
              rm -rf "docs/v/$id"
              # ★ Bei Fehlschlag das Original-Paket AUFHEBEN (nur Entpacktes loeschen) -
              #   damit laesst sich der Fall exakt nachstellen.
              find "$jobdir" -mindepth 1 ! -name "modell.zip*" -delete 2>/dev/null || true
              mkdir -p "jobs-ifc/$id"
              { date -u +"%Y-%m-%dT%H:%M:%SZ (Code $rc)"; echo "---"; tail -n 25 "$LOGDATEI"; } > "jobs-ifc/$id/.failed"
              mkdir -p "docs/v/$id"
              tail -n 6 "$LOGDATEI" > /tmp/gokoba_grund.txt
              python3 -c 'import sys,html; g=html.escape(open("/tmp/gokoba_grund.txt",encoding="utf-8",errors="replace").read()[-800:]); open(sys.argv[1],"w",encoding="utf-8").write("<!DOCTYPE html><html lang=\"de\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Modell konnte nicht gebaut werden</title><style>body{font-family:system-ui;background:#0E1519;color:#DDE6EC;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}.k{max-width:640px;padding:36px;background:#141D23;border:1px solid #24313A;border-radius:14px}h1{font-size:19px;margin:0 0 10px}p{color:#9FB3C0;line-height:1.5}pre{background:#0E1519;border:1px solid #24313A;border-radius:8px;padding:12px;font-size:11px;overflow:auto;color:#C8D4DC;white-space:pre-wrap}</style></head><body><div class=\"k\"><h1>Dieses Modell konnte nicht gebaut werden.</h1><p>Beim Umwandeln ist ein Fehler aufgetreten. Bitte den Auftrag erneut hochladen oder diese Meldung an den Ersteller weitergeben:</p><pre>"+g+"</pre></div></body></html>")' "docs/v/$id/index.html" || true
              PROBLEME=$((PROBLEME + 1))
              echo "IFC-Job $id FEHLGESCHLAGEN (Code $rc) - uebersprungen."
            fi
            # ★ Ergebnis SOFORT sichern: stirbt der Lauf spaeter (Zeitlimit, Absturz),
            #   bleibt jedes fertige Modell erhalten und der naechste Lauf macht weiter.
            git config user.name "gokoba-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "IFC-Viewer $id" >/dev/null
              for i in 1 2 3 4 5; do
                # ★ -X theirs: bei Inhaltskonflikt (Viewer gegen frische Warteseite)
                #   gewinnt UNSERE Fassung - der Viewer ersetzt die Warteseite ja gerade.
                git pull --rebase -X theirs origin main && git push && break
                git rebase --abort >/dev/null 2>&1 || true
                echo "Push-Versuch $i abgeprallt - neuer Anlauf..."
                sleep $((i * 3))
              done
            fi
            echo "::endgroup::"
          done
          echo "Durchlauf beendet. Fehlgeschlagene Jobs in diesem Lauf: $PROBLEME"

      - name: Ergebnisse committen
        run: |
          git config user.name "gokoba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "IFC-Viewer erstellt/aktualisiert"
            # ★ Der Zweig bewegt sich waehrend des Laufs (Warteseiten, neue Uploads).
            #   Deshalb: vor jedem Push aktualisieren und bis zu fuenfmal erneut versuchen.
            for i in 1 2 3 4 5; do
              # ★ -X theirs: bei Inhaltskonflikt (Viewer gegen frische Warteseite)
              #   gewinnt UNSERE Fassung - der Viewer ersetzt die Warteseite ja gerade.
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort >/dev/null 2>&1 || true
              echo "Push-Versuch $i abgeprallt - neuer Anlauf..."
              sleep $((i * 3))
            done
          fi

      - name: GitHub Pages veroeffentlichen
        if: always()
        run: |
          echo "Stosse GitHub-Pages-Veroeffentlichung an..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          echo "Fertig."
