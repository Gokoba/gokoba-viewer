name: IFC zu 3D-Viewer

# ★ Eigener, vom STEP-Weg GETRENNTER Zweig: reagiert NUR auf jobs-ifc/,
#   der bestehende Workflow (convert.yml) reagiert NUR auf jobs/.
#   Beide koennen sich dadurch nicht in die Quere kommen.
on:
  push:
    paths:
      - 'jobs-ifc/**'
  workflow_dispatch:
  # ★ Besenwagen: verarbeitet liegengebliebene Jobs, falls ein Lauf je scheitert
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: gokoba-convert-ifc
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paket-Cache (pip)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ifc-v1

      - name: Paket-Cache (npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-gltfpack-v1

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install ifcopenshell trimesh numpy mapbox_earcut
          # ★ gltfpack fest auf 1.1.0, wie im STEP-Workflow (1.2.0 haengt beim Komprimieren).
          npm install -g gltfpack@1.1.0

      - name: Offene IFC-Jobs verarbeiten
        run: |
          # ★ Kein "set -e": ein fehlerhafter Job darf die anderen nicht blockieren.
          shopt -s nullglob
          PROBLEME=0
          # ★ Neueste Auftraege zuerst: frische Kunden-Uploads ueberholen Altlasten.
          LISTE=$(for d in jobs-ifc/*/; do t=$(git log -1 --format=%ct -- "$d" 2>/dev/null || echo 0); echo "$t $d"; done | sort -rn | awk '{print $2}')
          for jobdir in $LISTE; do
            id=$(basename "$jobdir")
            # ★ Eine WARTESEITE zaehlt nicht als fertiger Viewer! Das Plugin legt sie
            #   beim Knopfdruck an - ohne diese Pruefung wuerde jeder Job uebersprungen.
            if [ -f "docs/v/$id/index.html" ] && ! grep -q "Modell wird gerade erstellt" "docs/v/$id/index.html"; then continue; fi
            if [ -f "$jobdir/.done" ] || [ -f "$jobdir/.failed" ]; then continue; fi
            echo "::group::IFC-Job $id"
            # Stueckweise hochgeladene ZIPs wieder zusammenfuegen (grosse Modelle).
            # ★ compgen statt ls: "ls pfad*" greift mit nullglob auch OHNE Teile
            #   (Glob verschwindet, ls listet das Repo, Ergebnis 0) und der cat
            #   ueberschreibt dann das gute modell.zip mit einer LEEREN Datei.
            if compgen -G "${jobdir}modell.zip.part*" >/dev/null; then
              cat "$jobdir"modell.zip.part* > "$jobdir/modell.zip.ganz"
              mv "$jobdir/modell.zip.ganz" "$jobdir/modell.zip"
              rm -f "$jobdir"modell.zip.part*
            fi
            # ZIP-Uploads entpacken (Windows: rechte Maustaste, ZIP-komprimierter Ordner)
            for z in "$jobdir"*.zip; do
              unzip -o -j "$z" -d "$jobdir" >/dev/null && rm -f "$z"
            done
            # ★ Noch keine Nutzdaten da (z.B. nur name.txt committet)? Still ueberspringen,
            #   KEIN Fehler-Marker - das ZIP kommt oft erst im naechsten Commit.
            if ! ls "$jobdir"*.zip "$jobdir"*.ifc >/dev/null 2>&1; then
              echo "Job $id: noch keine ZIP/IFC-Datei, warte auf naechsten Commit."
              echo "::endgroup::"
              continue
            fi
            # Projektname (optional)
            name="Modell"
            if [ -f "$jobdir/name.txt" ]; then
              name=$(cat "$jobdir/name.txt")
            fi
            mkdir -p "docs/v/$id"
            # ★ 15-Minuten-Zeitlimit je Modell; haengt eines, wird nur dieses abgebrochen.
            if timeout 900 python convert_ifc.py \
                 --input-dir "$jobdir" \
                 --output "docs/v/$id/index.html" \
                 --model-name "$name" \
                 --expiry-days 40 \
                 --gltfpack gltfpack; then
              rm -rf "$jobdir"
              mkdir -p "jobs-ifc/$id"
              date -u +"%Y-%m-%dT%H:%M:%SZ" > "jobs-ifc/$id/.done"
              echo "IFC-Job $id fertig."
            else
              rc=$?
              rm -rf "docs/v/$id"
              rm -rf "$jobdir"
              mkdir -p "jobs-ifc/$id"
              date -u +"%Y-%m-%dT%H:%M:%SZ (Code $rc)" > "jobs-ifc/$id/.failed"
              PROBLEME=$((PROBLEME + 1))
              echo "IFC-Job $id FEHLGESCHLAGEN (Code $rc) - uebersprungen."
            fi
            # ★ Ergebnis SOFORT sichern: stirbt der Lauf spaeter (Zeitlimit, Absturz),
            #   bleibt jedes fertige Modell erhalten und der naechste Lauf macht weiter.
            git config user.name "gokoba-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "IFC-Viewer $id" >/dev/null
              for i in 1 2 3 4 5; do
                git pull --rebase origin main && git push && break
                echo "Push-Versuch $i abgeprallt - neuer Anlauf..."
                sleep $((i * 3))
              done
            fi
            echo "::endgroup::"
          done
          echo "Durchlauf beendet. Fehlgeschlagene Jobs in diesem Lauf: $PROBLEME"

      - name: Ergebnisse committen
        run: |
          git config user.name "gokoba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "IFC-Viewer erstellt/aktualisiert"
            # ★ Der Zweig bewegt sich waehrend des Laufs (Warteseiten, neue Uploads).
            #   Deshalb: vor jedem Push aktualisieren und bis zu fuenfmal erneut versuchen.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push-Versuch $i abgeprallt - neuer Anlauf..."
              sleep $((i * 3))
            done
          fi

      - name: GitHub Pages veroeffentlichen
        if: always()
        run: |
          echo "Stosse GitHub-Pages-Veroeffentlichung an..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          echo "Fertig."
